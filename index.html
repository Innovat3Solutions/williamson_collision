        {
          "@type": "Question",
          "name": "Do I have to use the shop my insurance company recommends?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Florida law gives you the right to choose who repairs your vehicle — your insurer cannot require you to use a specific shop. Bring your claim to us and we'll coordinate directly with your carrier from the first estimate to final delivery."
          }
        },
        {
          "@type": "Question",
          "name": "Do you repair all makes and models?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We hold factory certifications for more than 15 brands — including GM, Stellantis, Hyundai, Kia, Nissan, and Infiniti — and every other make is repaired in the same facility, by the same OEM-trained technicians, to the same standard."
          }
        },
        {
          "@type": "Question",
          "name": "Will you handle my insurance claim?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We're a direct repair partner for carriers including State Farm Select Service and USAA STARS, and we work with all major insurers. We handle the estimates, supplements, photos, and direct billing so you don't have to."
          }
        },
        {
          "@type": "Question",
          "name": "Can I get a rental car while my vehicle is repaired?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — Enterprise Rent-A-Car operates a counter right on our property. Drop your keys with an advisor and drive out in a rental, with insurance direct billing available."
          }
        },
        {
          "@type": "Question",
          "name": "How long will my repair take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on the extent of the damage and parts availability. You'll get a time estimate up front, we stage OEM parts on-site before work begins, and your advisor keeps you updated at every stage of the repair."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get an estimate?",
          "acceptedAnswer": {

          }
        }
